<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">Mariana Duque</title>
  <desc id="d">Estudiante de Administración de Sistemas Informáticos en la Universidad Nacional de Colombia, sede Manizales</desc>
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="360" rx="28"/></clipPath>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="28"/></filter>
    <style>
      .float-a { animation: fa 9s ease-in-out infinite; transform-origin: center; }
      .float-b { animation: fb 11s ease-in-out infinite; transform-origin: center; }
      .float-c { animation: fa 13s ease-in-out infinite reverse; transform-origin: center; }
      @keyframes fa { 0%,100% { transform: translate(0,0); } 50% { transform: translate(14px,-10px); } }
      @keyframes fb { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-16px,12px); } }
      .twinkle { animation: tw 3.2s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .float-a,.float-b,.float-c,.twinkle { animation: none; } }
      .serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; }
      .sans  { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono  { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="#FFFBF3"/>

    <!-- manchas pastel -->
    <g filter="url(#blur)">
      <circle class="float-a" cx="1040" cy="70"  r="150" fill="#FFE9A8" opacity=".9"/>
      <circle class="float-b" cx="1130" cy="300" r="140" fill="#FFCFE0" opacity=".85"/>
      <circle class="float-c" cx="860"  cy="330" r="120" fill="#CDE4FF" opacity=".9"/>
      <circle class="float-b" cx="40"   cy="20"  r="110" fill="#CDE4FF" opacity=".6"/>
    </g>

    <!-- renglones de cuaderno, muy suaves -->
    <g stroke="#EADFCB" stroke-width="1" opacity=".55">
      <line x1="0" y1="96"  x2="1200" y2="96"/>
      <line x1="0" y1="136" x2="1200" y2="136"/>
      <line x1="0" y1="176" x2="1200" y2="176"/>
      <line x1="0" y1="216" x2="1200" y2="216"/>
      <line x1="0" y1="256" x2="1200" y2="256"/>
      <line x1="0" y1="296" x2="1200" y2="296"/>
    </g>
    <line x1="64" y1="0" x2="64" y2="360" stroke="#F7B9CF" stroke-width="1.5" opacity=".7"/>
  </g>

  <!-- saludo en sus tres idiomas -->
  <text x="100" y="84" class="mono" font-size="17" fill="#8A8299" letter-spacing="1.5">hola · hello · bonjour</text>

  <!-- nombre -->
  <text x="98" y="178" class="serif" font-size="78" fill="#4A4458">Mariana Duque</text>

  <!-- subrayado ondulado a mano -->
  <path d="M104 202 C 150 190, 190 214, 236 202 S 322 190, 368 202 S 454 214, 500 202 S 586 190, 632 202"
        fill="none" stroke="#F2A7C3" stroke-width="4" stroke-linecap="round"/>

  <text x="100" y="252" class="sans" font-size="23" fill="#5E5670">Administración de Sistemas Informáticos</text>
  <text x="100" y="284" class="sans" font-size="18" fill="#8A8299">Universidad Nacional de Colombia · Manizales</text>

  <!-- tres puntos firma: amarillo, rosado, azul -->
  <circle cx="108" cy="318" r="7" fill="#F6D365"/>
  <circle cx="130" cy="318" r="7" fill="#F2A7C3"/>
  <circle cx="152" cy="318" r="7" fill="#9CC7F2"/>

  <!-- tarjetita de código -->
  <g transform="translate(860 118) rotate(-4)">
    <rect width="236" height="120" rx="16" fill="#FFFFFF" opacity=".85" stroke="#F0E4CF"/>
    <circle cx="22" cy="22" r="5" fill="#F2A7C3"/>
    <circle cx="38" cy="22" r="5" fill="#F6D365"/>
    <circle cx="54" cy="22" r="5" fill="#9CC7F2"/>
    <text x="22" y="62" class="mono" font-size="16" fill="#7FA9D8">const</text>
    <text x="76" y="62" class="mono" font-size="16" fill="#4A4458">yo = {</text>
    <text x="38" y="86" class="mono" font-size="16" fill="#D98BA9">aprendiendo:</text>
    <text x="160" y="86" class="mono" font-size="16" fill="#C9A227">true</text>
    <text x="22" y="108" class="mono" font-size="16" fill="#4A4458">}</text>
  </g>

  <!-- destellos -->
  <g class="twinkle" fill="#F6D365">
    <path d="M790 92 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z"/>
  </g>
  <g class="twinkle" fill="#9CC7F2" style="animation-delay:1.4s">
    <path d="M1118 214 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
  </g>
</svg>
